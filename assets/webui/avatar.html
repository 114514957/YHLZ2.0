<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>YHLZ · 形象</title>
<style>
  html,body{margin:0;height:100%;background:#101318;overflow:hidden;color:#cfe0d8;
    font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;}
  #wrap{position:absolute;inset:0;}
  #dbg{position:absolute;left:10px;bottom:10px;max-width:70%;background:rgba(0,0,0,.55);
    color:#7fdcb6;padding:6px 10px;border-radius:8px;white-space:pre-wrap;font-size:12px;
    max-height:40vh;overflow-y:auto;}
  #bar{position:absolute;top:10px;left:10px;display:flex;gap:8px;}
  button{background:#1a5fd0;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;}
  .chip{padding:6px 14px;border-radius:14px;background:rgba(255,255,255,.12);color:#bfe;
    font-size:12px;align-self:center;}
  .chip.live{color:#ffd76e;}
</style>
</head>
<body>
<div id="wrap"></div>
<div id="bar">
  <span id="stage" class="chip">空闲</span>
  <select id="modelSel" class="chip" title="切换模型"></select>
  <button id="btnEx">换表情</button>
  <button id="btnTalk">测试口型</button>
</div>
<div id="dbg">加载中…</div>

<script src="/live2d/pixi.min.js"></script>
<script src="/live2d/live2dcubismcore.min.js"></script>
<script src="/live2d/cubism4.min.js"></script>
<script>
const wrap = document.getElementById('wrap');
const dbg  = document.getElementById('dbg');
function log(t){ dbg.textContent += '\n' + t; dbg.scrollTop = dbg.scrollHeight; }
function findGlobal(){
  const keys = [];
  for (const k of Object.keys(window)) {
    if (/live2d|Live2D|cubism/i.test(k)) keys.push(k + (typeof window[k]));
  }
  return keys;
}
(async () => {
  log('pixi=' + !!(window.PIXI) + ' core=' + !!(window.Live2DCubismCore));
  log('globals: ' + (findGlobal().join(', ') || '(none)'));
  const ns = window.PIXI?.live2d;
  log('PIXI.live2d keys: ' + (ns ? Object.keys(ns).join(',') : '(无 PIXI.live2d)'));
  let LM = window.Live2DModel;
  if (!LM && ns) { LM = ns.Live2DModel || ns.default?.Live2DModel; }
  if (!window.PIXI) { log('PIXI 未加载'); return; }
  if (!LM) { log('未找到 Live2DModel'); return; }
  log('Live2DModel OK');
  const app = new PIXI.Application({ resizeTo: window, backgroundAlpha: 0, antialias: true });
  wrap.appendChild(app.view);
  let model = null;
  async function loadModel(rel) {
    if (model) { app.stage.removeChild(model); try { model.destroy(true); } catch (e) {} }
    const url = '/live2d-models/' + rel.split('/').map(encodeURIComponent).join('/');
    log('加载 ' + rel);
    model = await LM.from(url);
    app.stage.addChild(model);
    const s = Math.min(app.screen.width / model.width, app.screen.height / model.height);
    model.scale.set(s, s);
    model.anchor.set(0.5, 0.5);
    model.x = app.screen.width / 2;
    model.y = app.screen.height * 0.55;
    log('模型就绪 ' + rel);
  }
  const enc = (s) => encodeURIComponent(s);
  try {
    const ml = await (await fetch('/avatar-models')).json();
    const sel = document.getElementById('modelSel');
    for (const it of (ml.items || [])) {
      const o = document.createElement('option');
      o.value = it.rel; o.textContent = it.name;
      sel.appendChild(o);
    }
    sel.onchange = () => { if (sel.value) loadModel(sel.value).catch(e => log('换模型错误 ' + (e && e.message || e))); };
    await loadModel(sel.value || 'YH3/seethrough_output.model3.json');
  } catch (e) { log('模型列表/加载错误 ' + (e && e.message || e)); }
  window._model = () => model;
  let phase = 0;
  let talking = 0;
  let avState = 'idle';
  if ("BroadcastChannel" in window) {
    const ch = new BroadcastChannel("yhlz-avatar");
    ch.onmessage = (e) => {
      avState = e.data && e.data.stage || 'idle';
      const el = document.getElementById('stage');
      const map = { listening: '聆听中…', thinking: '思考中…', speaking: '说话中…', asr: '识别中…', idle: '空闲' };
      el.textContent = map[avState] || avState;
      el.classList.toggle('live', avState === 'speaking');
    };
  }
  app.ticker.add(() => {
    phase += 0.03;
    const open = (avState === 'speaking' || talking > 0);
    if (talking > 0) talking -= 1;
    if (open) {
      const m = Math.abs(Math.sin(phase * 11)) * 0.7;
      model.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', m);
    } else {
      model.internalModel.coreModel.addParameterValueById('ParamMouthOpenY', -0.1);
    }
    model.internalModel.coreModel.addParameterValueById('ParamBreath',
                                                         Math.sin(phase) * 0.05);
  });
  document.getElementById('btnEx').onclick = () => {
    if (model.internalModel.motionManager) {
      log('motion: 请求随机动作(若模型有动作集)');
    }
  };
  document.getElementById('btnTalk').onclick = () => { talking = 70; };
})().catch(e => { log('错误: ' + (e && e.message || e)); });
</script>
</body>
</html>
