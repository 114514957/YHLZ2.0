<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>元亨 · 工作台</title>
<link rel="stylesheet" href="/console.css">
</head>
<body>
<header>
  <h1>元亨 · 工作台 <span id="ver" class="dim">M1</span></h1>
  <div id="lamps" class="lamps">
    <span class="lamp" id="l-daemon">daemon …</span>
    <span class="lamp" id="l-gemma">gemma …</span>
    <span class="lamp" id="l-busy">空闲</span>
    <span class="lamp dim" id="l-info">历史 0 轮 · L2 0</span>
  </div>
</header>
<main>
  <section id="chat">
    <div id="msgs"></div>
  </section>
  <footer>
    <div id="bar">
      <form id="talk">
        <input id="in" type="text" autocomplete="off"
               placeholder="输入消息，回车发送…">
        <button id="send" type="submit">发送</button>
      </form>
      <button id="voiceBtn" type="button" title="说一句话（说完停3秒自动断）">🎤 语音</button>
      <div id="vad"><i id="vadbar"></i></div>
    </div>
    <p id="hint" class="dim">工作台：文本/语音对话流式。语音=听→识别→元亨→发声(后端)。</p>
  </footer>
</main>
<script src="/console.js"></script>
</body>
</html>
