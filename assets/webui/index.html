<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>元亨 · 工作台</title>
<link rel="stylesheet" href="/console.css">
</head>
<body>
<header>
  <h1>元亨 · 工作台 <span id="ver" class="dim">M1</span></h1>
  <div id="lamps" class="lamps">
    <span class="lamp" id="l-daemon">daemon …</span>
    <span class="lamp" id="l-gemma">gemma …</span>
    <span class="lamp" id="l-busy">空闲</span>
    <span class="lamp dim" id="l-info">历史 0 轮 · L2 0</span>
  </div>
</header>
<main>
  <section id="chat">
    <div id="msgs"></div>
  </section>
  <footer>
    <form id="talk">
      <input id="in" type="text" autocomplete="off"
             placeholder="输入消息，回车发送…">
      <button id="send" type="submit">发送</button>
    </form>
    <p id="hint" class="dim">工作台 M1：文本对话 + 流式 + 状态。语音/监控/台账将接入。</p>
  </footer>
</main>
<script src="/console.js"></script>
</body>
</html>
