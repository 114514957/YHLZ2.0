<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D Debug Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #f0f0f0; 
            overflow: hidden; 
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #log {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            overflow-y: auto;
            border-radius: 8px;
            z-index: 100;
        }
        .error { color: #ff0000; }
        .warn { color: #ffff00; }
        #canvas-container { 
            width: 100%; 
            height: 100%; 
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div id="log">Live2D Debug Viewer<br></div>
    <div id="canvas-container"></div>

    <script>
        const logDiv = document.getElementById('log');
        const container = document.getElementById('canvas-container');
        
        function log(msg, type='info') {
            const span = document.createElement('span');
            if (type === 'error') span.className = 'error';
            else if (type === 'warn') span.className = 'warn';
            span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            logDiv.appendChild(span);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }

        log('=== 开始加载 ===');

        const scripts = [
            './live2dcubismcore.min.js',
            './pixi.min.js',
            './pixi-live2d-display.min.js'
        ];

        let loadedCount = 0;
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => {
                    log(`✅ 已加载: ${src}`);
                    resolve();
                };
                script.onerror = () => {
                    log(`❌ 加载失败: ${src}`, 'error');
                    reject(new Error(`Failed to load ${src}`));
                };
                document.head.appendChild(script);
            });
        }

        async function init() {
            try {
                log('加载依赖库...');
                for (const script of scripts) {
                    await loadScript(script);
                }

                log(`PIXI: ${typeof PIXI}`);
                log(`PIXI.live2d: ${typeof PIXI.live2d}`);
                log(`Live2DCubismCore: ${typeof Live2DCubismCore}`);

                if (PIXI.live2d) {
                    log(`PIXI.live2d 内容: ${JSON.stringify(Object.keys(PIXI.live2d))}`);
                }

                log('创建PIXI Application...');
                const app = new PIXI.Application({
                    view: document.createElement('canvas'),
                    backgroundAlpha: 0,
                    resizeTo: container
                });
                container.appendChild(app.view);
                log('PIXI Application创建成功');

                const modelPath = './hiyori_vts/hiyori.model3.json';
                log(`开始加载模型: ${modelPath}`);

                window.PIXI = PIXI;
                window.Live2DCubismCore = Live2DCubismCore;

                const Live2DModel = PIXI.live2d?.Live2DModel || PIXI.Live2DModel || window.Live2DModel;
                log(`Live2DModel: ${typeof Live2DModel}`);

                if (typeof Live2DModel === 'undefined') {
                    log('Live2DModel未找到!', 'error');
                    log('检查pixi-live2d-display版本是否正确...', 'warn');
                    return;
                }

                const model = await Live2DModel.from(modelPath, {
                    autoInteract: true,
                    autoIdle: true,
                    idleMotionGroup: 'idle',
                    expressionGroup: 'default'
                });

                log('模型加载成功!');
                log(`模型名称: ${model.name}`);
                log(`模型尺寸: ${model.width} x ${model.height}`);

                app.stage.addChild(model);

                model.scale.set(0.5);
                model.x = app.screen.width / 2;
                model.y = app.screen.height;
                model.anchor.set(0.5, 1);

                log('模型已添加到舞台');

            } catch (e) {
                log(`加载失败: ${e.message}`, 'error');
                log(`堆栈: ${e.stack}`, 'error');
            }
        }

        init();
    </script>
</body>
</html>
